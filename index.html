<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Áudio Tesla v0.8</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E6E9ED; --surface:#FFFFFF; --line:#CDD3DA; --text:#15181D; --muted:#5E6875;
  --plasma:#0A84C6; --brake:#D9711C; --go:#15181D; --go-text:#FFFFFF;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1B1E24; --surface:#262A31; --line:#3A3F48; --text:#EDEFF2; --muted:#98A1AD;
    --plasma:#5AC8FA; --brake:#FF9F43; --go:#EDEFF2; --go-text:#1B1E24;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1B1E24; --surface:#262A31; --line:#3A3F48; --text:#EDEFF2; --muted:#98A1AD;
  --plasma:#5AC8FA; --brake:#FF9F43; --go:#EDEFF2; --go-text:#1B1E24;
  color-scheme: dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:500 17px/1.4 Barlow,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;min-height:100%}
header{display:flex;align-items:center;justify-content:space-between;padding:18px 24px 6px;max-width:1280px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:19px}
.dot{width:11px;height:11px;border-radius:50%;background:var(--line);transition:background .3s}
.dot.live{background:var(--plasma);box-shadow:0 0 12px var(--plasma)}
.ver{font-family:"Chakra Petch",sans-serif;font-weight:700;font-size:15px;padding:4px 10px;border:1.5px solid var(--line);border-radius:6px;color:var(--muted)}
main{display:grid;grid-template-columns:1.25fr 1fr;gap:20px;padding:12px 24px 28px;max-width:1280px;margin:0 auto}
@media (max-width:820px){main{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:24px}
.speed{display:flex;align-items:baseline;gap:12px}
#spd{font-family:"Chakra Petch",sans-serif;font-weight:700;font-size:clamp(96px,16vw,190px);line-height:.9;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.speed small{font-size:24px;color:var(--muted)}
.abar{position:relative;height:18px;border-radius:9px;background:var(--bg);margin:26px 0 8px;overflow:hidden}
.abar .mid{position:absolute;left:50%;top:0;bottom:0;width:2px;background:var(--line);transform:translateX(-1px)}
#afill{position:absolute;top:0;bottom:0;left:50%;width:0;background:var(--plasma)}
.alabels{display:flex;justify-content:space-between;color:var(--muted);font-size:15px}
#ag{font-family:"Chakra Petch",sans-serif;color:var(--text);font-variant-numeric:tabular-nums}
.status{margin-top:22px;font-size:17px;min-height:1.4em}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px;border-top:1px solid var(--line);padding-top:16px}
.stats b{display:block;font-family:"Chakra Petch",sans-serif;font-size:24px;font-variant-numeric:tabular-nums}
.stats span{color:var(--muted);font-size:14px}
.controls{display:flex;flex-direction:column;gap:14px}
.go{appearance:none;border:0;border-radius:14px;background:var(--go);color:var(--go-text);font:600 22px Barlow,sans-serif;padding:22px;cursor:pointer}
.go.on{background:var(--brake);color:#1B1E24}
.lab{color:var(--muted);font-size:15px;margin-top:6px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;background:var(--bg);padding:5px;border-radius:12px}
.seg button{appearance:none;border:0;background:transparent;color:var(--text);font:600 18px Barlow,sans-serif;padding:14px 8px;border-radius:9px;cursor:pointer}
.seg button.on{background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--plasma)}
#presets{grid-auto-flow:row;grid-template-columns:repeat(3,1fr)}
.eng{margin-top:14px;font-family:"Chakra Petch",sans-serif;font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--plasma)}
.eng[hidden]{display:none}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block}
header,main{position:relative;z-index:1}
.panel{background:color-mix(in srgb,var(--surface) 84%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
header{background:color-mix(in srgb,var(--surface) 84%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:14px;margin:12px auto 0;width:calc(100% - 48px);padding:10px 18px}
.hdr-r{display:flex;align-items:center;gap:10px}
.vbtn{appearance:none;border:1.5px solid var(--line);background:transparent;color:var(--text);font:600 17px Barlow,sans-serif;padding:8px 16px;border-radius:9px;cursor:pointer}
#hud{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:1;display:none;text-align:center;color:#EDEFF2;font-family:"Chakra Petch",sans-serif;text-shadow:0 0 12px rgba(0,0,0,.8)}
#hud b{font-size:44px;font-weight:700;font-variant-numeric:tabular-nums}
#hud small{font-size:18px;opacity:.75;margin-left:6px}
#hudEng{font-size:20px;color:#5AC8FA}
body.view main{display:none}
body.view #hud{display:block}
body.view.car #hud{bottom:auto;top:calc(84px + env(safe-area-inset-top,0px))}
.slider{display:grid;grid-template-columns:120px 1fr;align-items:center;gap:12px}
.slider span{font-size:16px}
input[type=range]{width:100%;accent-color:var(--plasma);height:32px}
.hint{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;margin:-10px 0 0 132px}
.pedals{display:grid;grid-template-columns:1fr 1.4fr;gap:10px}
.pedals[hidden]{display:none}
.pedals button{appearance:none;border:2px solid var(--line);background:var(--bg);color:var(--text);font:600 20px Barlow,sans-serif;padding:30px 10px;border-radius:14px;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:pointer}
.pedals button.down#thr{border-color:var(--plasma);color:var(--plasma)}
.pedals button.down#brk{border-color:var(--brake);color:var(--brake)}
#lock{position:fixed;inset:0;z-index:5;display:grid;place-items:center;background:var(--bg);padding:16px}
#lock[hidden]{display:none}
.lockbox{display:flex;flex-direction:column;gap:14px;width:min(420px,100%);background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:28px}
#pin{font:700 34px "Chakra Petch",sans-serif;letter-spacing:.3em;text-align:center;padding:14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--text);width:100%}
#lockMsg{min-height:1.4em}
button:focus-visible,input:focus-visible{outline:3px solid var(--plasma);outline-offset:2px}
</style>
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>
<div id="lock" hidden>
  <form id="lockForm" class="lockbox" autocomplete="off">
    <div class="brand"><span class="dot"></span>Áudio Tesla</div>
    <label for="pin" class="lab">PIN</label>
    <input id="pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="12" autocomplete="off" aria-describedby="lockMsg">
    <button class="go" id="unlock" type="submit">Desbloquear</button>
    <div class="lab" id="lockMsg" role="status"></div>
  </form>
</div>
<div id="hud"><div><b id="hudSpd">0</b><small>km/h</small></div><div id="hudEng"></div></div>
<header>
  <div class="brand"><span class="dot" id="dot"></span>Áudio Tesla</div>
  <div class="hdr-r"><button class="vbtn" id="viewBtn">Nave</button><span class="ver" id="ver">v0.8</span></div>
</header>
<main>
  <section class="panel">
    <div class="speed"><span id="spd">0</span><small>km/h</small></div>
    <div class="abar"><div class="mid"></div><div id="afill"></div></div>
    <div class="alabels"><span>Travagem</span><span id="ag">0,00 g</span><span>Aceleração</span></div>
    <div class="eng" id="eng" hidden></div>
    <div class="status" id="status">Escolhe um som e carrega em Iniciar.</div>
    <div class="stats">
      <div><b id="acc">–</b><span>Precisão GPS</span></div>
      <div><b id="rate">–</b><span>Leituras por segundo</span></div>
      <div><b id="src">–</b><span>Fonte da velocidade</span></div>
    </div>
  </section>

  <section class="panel controls">
    <button class="go" id="go">Iniciar</button>
    <div class="lab">Som</div>
    <div class="seg" id="presets">
      <button data-p="nave" class="on">Nave</button>
      <button data-p="orni">Ornitóptero</button>
      <button data-p="gt3s">GT3 Real</button>
      <button data-p="gt3">GT3 Synth</button>
      <button data-p="turbina">Turbina</button>
      <button data-p="pulsar">Pulsar</button>
    </div>
    <label class="slider"><span>Volume</span><input type="range" id="vol" min="0" max="1" step="0.01" value="0.7"></label>
    <label class="slider"><span>Estabilidade</span><input type="range" id="stab" min="0" max="1" step="0.01" value="0.6"></label>
    <div class="hint"><span>mais reativo</span><span>mais estável</span></div>
    <label class="slider"><span>Sensibilidade</span><input type="range" id="sens" min="0" max="1" step="0.01" value="0.55"></label>
    <div class="hint"><span>suave</span><span>agressivo</span></div>
    <div class="lab">Dados</div>
    <div class="seg" id="modes">
      <button data-m="gps" class="on">GPS</button>
      <button data-m="sim">Simulação</button>
    </div>
    <div class="pedals" id="pedals" hidden>
      <button id="brk">Travar</button>
      <button id="thr">Acelerar</button>
    </div>
  </section>
</main>

<script>
const VERSION = 'v0.8';
const $ = id => document.getElementById(id);
const clamp = (x,a,b) => Math.max(a, Math.min(b, x));

/* ---------- Filtro de Kalman 1D: estado [velocidade, aceleração] ---------- */
class SpeedKF {
  constructor(){ this.q = 0.5; this.reset(); }
  reset(){ this.v=0; this.a=0; this.P=[[25,0],[0,4]]; this.t=null; }
  predict(dt){
    const P=this.P, q=this.q;
    this.v += this.a*dt;
    const p00 = P[0][0] + dt*(P[1][0]+P[0][1]) + dt*dt*P[1][1] + q*dt*dt*dt/3;
    const p01 = P[0][1] + dt*P[1][1] + q*dt*dt/2;
    const p11 = P[1][1] + q*dt;
    this.P=[[p00,p01],[p01,p11]];
  }
  innovationSigma(){ return Math.sqrt(this.P[0][0]); }
  update(z,R){
    const P=this.P, S=P[0][0]+R, k0=P[0][0]/S, k1=P[1][0]/S, y=z-this.v;
    this.v += k0*y; this.a += k1*y;
    this.a = clamp(this.a, -10, 7);
    this.P=[[(1-k0)*P[0][0],(1-k0)*P[0][1]],[(1-k0)*P[0][1],P[1][1]-k1*P[0][1]]];
  }
  ingest(z,R,t){
    if(this.t===null){ this.v=z; this.a=0; this.t=t; return; }
    const dt=(t-this.t)/1000; if(dt<=0) return;
    if(dt>5){ this.v=z; this.a=0; this.P=[[4,0],[0,4]]; this.t=t; return; }
    this.predict(dt); this.update(z,R); this.t=t;
  }
  // Extrapola entre leituras (GPS ~1 Hz) para o som não andar aos saltos
  estimate(t){
    if(this.t===null) return {v:0,a:0};
    const dt=(t-this.t)/1000;
    const fade=Math.exp(-Math.max(0,dt-1.2)/0.6);
    return { v: Math.max(0, this.v + this.a*Math.min(dt,1.2)), a: this.a*fade };
  }
}
const kf = new SpeedKF();

/* ---------- Áudio ---------- */
let ctx=null, master, engine=null, preset='nave';
const tset=(p,v,tc=0.06)=>p.setTargetAtTime(v, ctx.currentTime, tc);
function H(){ return {
  osc:(type,f=100)=>{const o=ctx.createOscillator(); o.type=type; o.frequency.value=f; return o;},
  gain:v=>{const g=ctx.createGain(); g.gain.value=v; return g;},
  filt:(type,f,Q=1)=>{const b=ctx.createBiquadFilter(); b.type=type; b.frequency.value=f; b.Q.value=Q; return b;},
  noise:()=>{const b=ctx.createBuffer(1,ctx.sampleRate*2,ctx.sampleRate), d=b.getChannelData(0);
    for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
    const n=ctx.createBufferSource(); n.buffer=b; n.loop=true; return n;},
  shaper:amt=>{const c=new Float32Array(1024); for(let i=0;i<1024;i++){const x=i/511.5-1; c[i]=Math.tanh(amt*x)/Math.tanh(amt);}
    const w=ctx.createWaveShaper(); w.curve=c; w.oversample='2x'; return w;}
};}
const link=(...n)=>{for(let i=0;i<n.length-1;i++) n[i].connect(n[i+1]); return n[n.length-1];};

const PRESETS = {
  // Nave: drone de serras desafinadas, filtro ressonante que abre com a velocidade, empuxo de ruído na aceleração
  nave(){
    const h=H(), out=h.gain(0);
    const o1=h.osc('sawtooth',40), o2=h.osc('sawtooth',40.3), sub=h.osc('sine',20);
    const wh=h.osc('sine',300), vib=h.osc('sine',5.5), lfo=h.osc('sine',0.5), n=h.noise();
    const mix=h.gain(0.3), lp=h.filt('lowpass',300,9), lfoG=h.gain(150), drv=h.shaper(2.2);
    o1.connect(mix); o2.connect(mix); link(mix,lp,drv,out);
    link(lfo,lfoG,lp.frequency);
    const subG=h.gain(0.5); link(sub,subG,out);
    const vibG=h.gain(6); link(vib,vibG,wh.frequency);
    const whG=h.gain(0); link(wh,whG,out);
    const bp=h.filt('bandpass',500,1.4), nG=h.gain(0); link(n,bp,nG,out);
    const srcs=[o1,o2,sub,wh,vib,lfo,n]; srcs.forEach(s=>s.start());
    return {out,srcs,update(s,ap,an){
      const f=36+150*s+35*ap-12*an;
      tset(o1.frequency,f); tset(o2.frequency,f*1.008); tset(sub.frequency,f/2);
      tset(lp.frequency,160+2400*s+2800*ap); tset(lfo.frequency,0.35+6*s+5*ap); tset(lfoG.gain,100+800*s+400*ap);
      tset(wh.frequency,f*7+500*ap); tset(whG.gain,0.015+0.05*s+0.05*ap);
      tset(bp.frequency,250+2000*s+1800*ap+400*an); tset(nG.gain,0.03+0.08*s+0.45*ap+0.25*an);
      tset(subG.gain,0.6-0.25*s); tset(out.gain,0.55,0.2);
    }};
  },
  // Turbina: assobio de reator com "flutter" (modulação de amplitude) que acelera com a velocidade
  turbina(){
    const h=H(), out=h.gain(0);
    const o1=h.osc('sawtooth',80), o2=h.osc('sawtooth',81), o3=h.osc('square',40);
    const mix=h.gain(0.25), hp=h.filt('highpass',70,0.7), lp=h.filt('lowpass',1200,3), drv=h.shaper(3.5), trem=h.gain(0.6);
    o1.connect(mix); o2.connect(mix); o3.connect(mix); link(mix,hp,lp,drv,trem,out);
    const tl=h.osc('triangle',20), tlG=h.gain(0.3); link(tl,tlG,trem.gain);
    const wh=h.osc('sine',400), whG=h.gain(0); link(wh,whG,out);
    const n=h.noise(), lp2=h.filt('lowpass',800,0.8), nG=h.gain(0); link(n,lp2,nG,out);
    const srcs=[o1,o2,o3,tl,wh,n]; srcs.forEach(s=>s.start());
    return {out,srcs,update(s,ap,an){
      const f=70+700*s+160*ap-60*an;
      tset(o1.frequency,f); tset(o2.frequency,f*1.012); tset(o3.frequency,f*0.5);
      tset(lp.frequency,900+3500*s+2500*ap); tset(tl.frequency,14+70*s+20*ap); tset(tlG.gain,0.25+0.2*ap);
      tset(wh.frequency,f*4); tset(whG.gain,0.01+0.05*s+0.04*ap);
      tset(lp2.frequency,500+1500*s+3000*ap); tset(nG.gain,0.04+0.1*s+0.4*ap+0.2*an);
      tset(out.gain,0.5,0.2);
    }};
  },
  // Pulsar: síntese FM metálica, índice de modulação cresce com a aceleração, pulsação rítmica
  pulsar(){
    const h=H(), out=h.gain(0);
    const car=h.osc('sine',110), mod=h.osc('sine',165), modG=h.gain(80);
    link(mod,modG,car.frequency);
    const pulse=h.gain(0.7), pl=h.osc('sine',3), plG=h.gain(0.3); link(pl,plG,pulse.gain);
    const lp=h.filt('lowpass',900,4); link(car,pulse,lp,out);
    const p1=h.osc('triangle',55), p2=h.osc('triangle',55.5), padG=h.gain(0.18);
    p1.connect(padG); p2.connect(padG); padG.connect(out);
    const n=h.noise(), hp=h.filt('highpass',5000,0.7), spG=h.gain(0); link(n,hp,spG,out);
    const srcs=[car,mod,pl,p1,p2,n]; srcs.forEach(s=>s.start());
    return {out,srcs,update(s,ap,an){
      const f=90+280*s+60*ap-30*an;
      tset(car.frequency,f); tset(mod.frequency,f*(1.5+0.5*ap)); tset(modG.gain,f*(0.8+2.5*s+5*ap));
      tset(pl.frequency,2+10*s+6*ap); tset(lp.frequency,700+4500*s+3000*ap);
      tset(p1.frequency,f/2); tset(p2.frequency,f/2*1.01);
      tset(spG.gain,0.01+0.08*ap+0.04*an); tset(out.gain,0.5,0.2);
    }};
  },
  // Ornitóptero: asas tipo libelinha. Um LFO moldado em impulsos faz o batimento; cada batida modula zumbido, ar e pancada grave
  orni(){
    const h=H(), out=h.gain(0);
    const wing=h.osc('sine',14);
    const pc=new Float32Array(1024); for(let i=0;i<1024;i++){const x=i/511.5-1; pc[i]=Math.pow(Math.max(0,(x+0.1)/1.1),3);}
    const ws=ctx.createWaveShaper(); ws.curve=pc; wing.connect(ws);
    const b1=h.osc('sawtooth',130), b2=h.osc('sawtooth',131.5);
    const bmix=h.gain(0.3), bbp=h.filt('bandpass',600,2.5), bdrv=h.shaper(2.5), bAM=h.gain(0.1);
    b1.connect(bmix); b2.connect(bmix); link(bmix,bbp,bdrv,bAM,out);
    const bDepth=h.gain(0.6); link(ws,bDepth,bAM.gain);
    const n=h.noise(), nbp=h.filt('bandpass',900,1.1), nAM=h.gain(0); link(n,nbp,nAM,out);
    const nDepth=h.gain(0.4); link(ws,nDepth,nAM.gain);
    const th=h.osc('sine',48), thAM=h.gain(0); link(th,thAM,out);
    const thDepth=h.gain(0.5); link(ws,thDepth,thAM.gain);
    const jet=h.osc('sine',800), jetG=h.gain(0); link(jet,jetG,out);
    const srcs=[wing,b1,b2,n,th,jet]; srcs.forEach(s=>s.start());
    return {out,srcs,update(s,ap,an){
      tset(wing.frequency,12+22*s+12*ap-5*an,0.15);
      const fb=110+120*s+60*ap;
      tset(b1.frequency,fb); tset(b2.frequency,fb*1.012);
      tset(bbp.frequency,450+1500*s+1200*ap);
      tset(bDepth.gain,0.5+0.3*ap); tset(bAM.gain,0.08+0.06*s);
      tset(nbp.frequency,600+1400*s+1000*ap); tset(nDepth.gain,0.25+0.25*s+0.4*ap+0.15*an);
      tset(th.frequency,42+20*s); tset(thDepth.gain,0.6-0.2*s);
      tset(jet.frequency,700+2200*s+600*ap); tset(jetG.gain,0.005+0.03*s+0.02*ap);
      tset(out.gain,0.6,0.2);
    }};
  },
  // GT3 Synth: flat-6 4.0 sintetizado. Espetro afinado pela gravação real: fundamental = meia ordem (rpm/120),
  // ordem 3 (ignição) domina a baixa rotação, ordens 6 e 9 crescem até ao corte
  gt3(){
    const h=H(), out=h.gain(0), dt=new Drivetrain();
    const mkWave=amps=>{ const re=new Float32Array(33), im=new Float32Array(33); for(let k=1;k<33;k++) im[k]=amps[k]||0.015; return ctx.createPeriodicWave(re,im); };
    const LOW={2:0.03,3:0.07,6:1,8:0.06,9:0.08,12:0.13,18:0.07,24:0.06};
    const HIGH={3:0.15,6:0.8,9:0.1,10:0.12,12:1,15:0.1,18:0.45,21:0.12,24:0.28,30:0.12};
    const wl=mkWave(LOW), wh=mkWave(HIGH);
    const lo1=h.osc('sine'), lo2=h.osc('sine'), hi1=h.osc('sine'), hi2=h.osc('sine');
    lo1.setPeriodicWave(wl); lo2.setPeriodicWave(wl); hi1.setPeriodicWave(wh); hi2.setPeriodicWave(wh);
    const loG=h.gain(1), hiG=h.gain(0), body=h.gain(0.5);
    const d2=h.gain(0.35), d2h=h.gain(0.35); lo1.connect(loG); link(lo2,d2,loG); hi1.connect(hiG); link(hi2,d2h,hiG); loG.connect(body); hiG.connect(body);
    const lp=h.filt('lowpass',1500,0.9), howl=h.filt('peaking',900,2.5); howl.gain.value=7;
    const drv=h.shaper(1.8), load=h.gain(0.5), cutG=h.gain(1);
    link(body,lp,howl,drv,load,cutG,out);
    const jit=h.osc('sine',7.3), jitG=h.gain(4); link(jit,jitG,lo1.detune); jitG.connect(hi1.detune);
    const jit2=h.osc('triangle',11.1), jit2G=h.gain(4); link(jit2,jit2G,lo2.detune); jit2G.connect(hi2.detune);
    const n=h.noise(), nbp=h.filt('bandpass',2000,0.9), nG=h.gain(0); link(n,nbp,nG,out);
    const srcs=[lo1,lo2,hi1,hi2,jit,jit2,n]; srcs.forEach(s=>s.start());
    const pop=synthPops(h,out);
    return {out,srcs, info:()=>dt.info(),
      update(s,ap,an,x){
        dt.update(x.kmh,x.a,x.dt,x.sens);
        const r=dt.rpm/dt.RED, f=dt.rpm/120, L=dt.load;
        tset(lo1.frequency,f,0.02); tset(lo2.frequency,f*1.0015,0.02); tset(hi1.frequency,f,0.02); tset(hi2.frequency,f*1.0015,0.02);
        const xf=clamp((r-0.35)/0.45,0,1);
        tset(loG.gain,Math.cos(xf*Math.PI/2)); tset(hiG.gain,Math.sin(xf*Math.PI/2)*(0.7+0.3*L));
        tset(lp.frequency,500+2200*r+4000*L*r+600*L,0.04);
        tset(howl.frequency,f*12+150,0.03);
        tset(load.gain,(0.3+0.7*Math.max(L,0.2))*(0.5+0.4*r),0.03);
        tset(nbp.frequency,1500+3000*r); tset(nG.gain,0.008+0.04*r*(0.3+L));
        tset(out.gain,0.7,0.2);
        gt3Events(dt,cutG,pop);
      }};
  },
  // GT3 Real: amostras da gravação (encriptadas, desbloqueadas pelo PIN). Loops de afinação constante por banda de rotação,
  // em carga (a puxar) e em desaceleração; cada loop é transposto para a rotação atual e misturado com o vizinho
  gt3s(){
    const h=H(), out=h.gain(0);
    if(!gt3Bank) return {out,srcs:[],info:()=>'GT3 Real bloqueado (PIN)',update(){}};
    const buf=gt3Buffer(), sr=gt3Bank.sr, dt=new Drivetrain();
    const onBus=h.gain(0), offBus=h.gain(0), mix=h.gain(1);
    const low=h.filt('lowshelf',140,0.7); low.gain.value=3;
    const tone=h.filt('highshelf',2500,0.7); tone.gain.value=-4;
    const drv=h.shaper(1.3), cutG=h.gain(1);
    onBus.connect(mix); offBus.connect(mix); link(mix,low,tone,drv,cutG,out);
    const srcs=[];
    const layer=(kind,bus)=>gt3Bank.clips.filter(c=>c.kind===kind).sort((a,b)=>a.rpm-b.rpm).map(c=>{
      const s=ctx.createBufferSource(); s.buffer=buf; s.loop=true; s.loopStart=c.start/sr; s.loopEnd=(c.start+c.len)/sr;
      const g=h.gain(0); s.connect(g); g.connect(bus); s.start(0, s.loopStart+Math.random()*c.len/sr); srcs.push(s);
      return {c,s,g};
    });
    const ON=layer('on',onBus), OFF=layer('off',offBus);
    const popClips=gt3Bank.clips.filter(c=>c.kind==='pop'), popBus=h.gain(0.9), popHP=h.filt('highpass',180,0.7);
    link(popBus,popHP,out);
    function pop(k,delay=0){
      const c=popClips[Math.floor(Math.random()*popClips.length)], t=ctx.currentTime+delay+Math.random()*0.03;
      const s=ctx.createBufferSource(); s.buffer=buf; s.playbackRate.value=0.8+Math.random()*0.4;
      const g=ctx.createGain(); g.gain.value=k*(0.6+0.4*Math.random()); s.connect(g); g.connect(popBus);
      s.start(t, c.start/sr, c.len/sr);
    }
    function mixLayer(L,rpm){
      const lr=Math.log(rpm); let i=L.findIndex(q=>q.c.rpm>=rpm), a, b, w=0;
      if(i===-1){ a=b=L[L.length-1]; } else if(i===0){ a=b=L[0]; }
      else { a=L[i-1]; b=L[i]; w=(lr-Math.log(a.c.rpm))/(Math.log(b.c.rpm)-Math.log(a.c.rpm)); }
      L.forEach(q=>{
        const g = q===a&&q===b ? 1 : q===a ? Math.cos(w*Math.PI/2) : q===b ? Math.sin(w*Math.PI/2) : 0;
        tset(q.g.gain,g,0.04); tset(q.s.playbackRate,clamp(rpm/q.c.rpm,0.25,3),0.025);
      });
    }
    return {out,srcs, info:()=>dt.info(),
      update(s,ap,an,x){
        dt.update(x.kmh,x.a,x.dt,x.sens);
        const rpm=dt.rpm, r=rpm/dt.RED, L=dt.load;
        mixLayer(ON,rpm); mixLayer(OFF,rpm);
        tset(onBus.gain,Math.sqrt(L)*(0.55+0.45*r),0.03);
        tset(offBus.gain,Math.sqrt(1-L)*(0.4+0.3*r),0.03);
        tset(tone.gain,-6+9*L*r,0.05);
        tset(out.gain,0.85,0.2);
        gt3Events(dt,cutG,pop);
      }};
  }
};

/* ---------- PDK de 7 relações: velocidade + aceleração → rotação, mudança, carga ---------- */
const lerp=(a,b,t)=>a+(b-a)*t;
class Drivetrain {
  constructor(){
    this.RATIOS=[3.75,2.38,1.72,1.34,1.11,0.96,0.84]; this.FINAL=4.30; this.CIRC=2.05; this.IDLE=950; this.RED=9000;
    this.gear=1; this.rpm=this.IDLE; this.thr=0; this.load=0; this.clock=0; this.lastShift=-9;
    this.cut=0; this.blip=0; this.ev=[]; this.overrun=false; this.wasOver=false; this.liftT=9; this.brake=0;
  }
  update(kmh,a,dt,sens){
    const v=kmh/3.6, R=this.RATIOS; this.clock+=dt; this.step=dt; this.ev.length=0;
    // sensibilidade: que aceleração real conta como acelerador a fundo (Tesla suave vs. agressivo)
    const aFull=lerp(5,1.5,sens);
    const overrun = v>2 && a<lerp(-0.45,-0.18,sens);
    let thr = overrun ? 0 : clamp(0.06+0.0015*kmh+Math.max(0,a)/aFull,0,1);
    if(v<0.5) thr=clamp(a/aFull,0,1);
    this.thr += (thr-this.thr)*(1-Math.exp(-dt/0.08));
    const T=this.thr, brake=clamp(-a/3.5,0,1), wr=v/this.CIRC*60*this.FINAL;
    // pontos de passagem: mais acelerador e mais sensibilidade = mudanças mais tarde
    const upAt=Math.min(8750, lerp(2700,4300,sens)+T*lerp(3600,4500,sens));
    const downAt= brake>0.1 ? lerp(2200,4000,sens)+brake*1600 : lerp(1300,2800,sens)+T*lerp(1800,3400,sens);
    if(this.clock-this.lastShift>0.32 && v>0.6){
      const g=this.gear;
      if(g<7 && !overrun && wr*R[g-1]>upAt && wr*R[g]>downAt+250){
        this.gear++; this.lastShift=this.clock; this.cut=0.06+0.06*T; this.ev.push(T>0.55?'upHard':'up');
      } else if(g>1 && wr*R[g-1]<downAt && wr*R[g-2]<Math.min(upAt-250,this.RED-500)){
        this.gear--; this.lastShift=this.clock; this.blip=0.2; this.ev.push('down');
      }
    }
    if(v<=0.6) this.gear=1;
    let target=wr*R[this.gear-1];
    if(this.gear===1 && v<9) target=Math.max(target, this.IDLE+T*lerp(1800,4200,sens)); // arranque com patinagem
    target=clamp(target,this.IDLE,this.RED);
    if(this.blip>0){ this.blip-=dt; target=Math.min(this.RED,target*1.1); }
    const tc=this.cut>0?0.035:(target<this.rpm?0.12:0.08);
    this.rpm += (target-this.rpm)*(1-Math.exp(-dt/tc));
    let L=overrun?0:T;
    if(this.blip>0) L=Math.max(L,0.65);
    if(this.cut>0){ this.cut-=dt; L=0; }
    if(this.rpm>this.RED-120 && T>0.6 && Math.sin(this.clock*2*Math.PI*11)<0){ L*=0.15; this.ev.push('limiter'); }
    this.load += (L-this.load)*(1-Math.exp(-dt/(L<this.load?0.03:0.06)));
    if(overrun && !this.wasOver) this.liftT=0;
    this.wasOver=overrun; this.overrun=overrun; this.liftT+=dt; this.brake=brake;
  }
  info(){ return this.gear+'ª   '+(Math.round(this.rpm/100)*100)+' rpm'; }
}
// eventos comuns aos dois GT3: corte de ignição na passagem, estalos na redução e em desaceleração
function gt3Events(dt,cutG,popFn){
  const t=ctx.currentTime, pop=(k,d)=>{ popFn(k,d); carFx.pop=Math.max(carFx.pop,k); };
  carFx.r=dt.rpm/dt.RED; carFx.load=dt.load; carFx.brake=dt.brake; carFx.gear=dt.gear;
  for(const e of dt.ev){
    if(e==='up'||e==='upHard'){
      const c=0.06+(e==='upHard'?0.05:0);
      cutG.gain.cancelScheduledValues(t); cutG.gain.setValueAtTime(cutG.gain.value,t);
      cutG.gain.linearRampToValueAtTime(e==='upHard'?0.12:0.35,t+0.012);
      cutG.gain.setValueAtTime(e==='upHard'?0.12:0.35,t+c); cutG.gain.linearRampToValueAtTime(1,t+c+0.05);
      if(e==='upHard'){ pop(0.9); if(Math.random()<0.7) pop(0.6); }
    } else if(e==='down'){ const d=0.12+Math.random()*0.12; if(Math.random()<0.8) pop(0.6,d); if(Math.random()<0.4) pop(0.4,d+0.07); }
  }
  if(dt.overrun && dt.rpm>2400){
    const r=dt.rpm/dt.RED, lam=(dt.liftT<1.4?8:2)*(0.35+r)+3*dt.brake;
    if(Math.random()<lam*dt.step) pop(0.25+0.55*Math.random());
  }
}
// estalos sintetizados (GT3 Synth)
function synthPops(h,out){
  const len=Math.floor(ctx.sampleRate*0.12), b=ctx.createBuffer(1,len,ctx.sampleRate), d=b.getChannelData(0);
  for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.exp(-i/(len*0.18));
  const bus=h.gain(1), drv=h.shaper(4); link(bus,drv,out);
  return (k,delay=0)=>{
    const t=ctx.currentTime+delay+Math.random()*0.03, s=ctx.createBufferSource(); s.buffer=b; s.playbackRate.value=0.6+Math.random()*0.9;
    const bp=ctx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=500+Math.random()*1800; bp.Q.value=1.5;
    const g=ctx.createGain(); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(0.5*k,t+0.003);
    g.gain.exponentialRampToValueAtTime(0.001,t+0.06+0.08*k);
    s.connect(bp); bp.connect(g); g.connect(bus); s.start(t); s.stop(t+0.25);
  };
}

/* ---------- Banco de amostras GT3 (assets/gt3.bin, AES-GCM, chave = PBKDF2(PIN)) ---------- */
let gt3Bank=null, gt3Buf=null, gt3BufCtx=null;
async function unlockBank(pin){
  const raw=new Uint8Array(await (await fetch('assets/gt3.bin?b=2',{cache:'no-cache'})).arrayBuffer());
  if(String.fromCharCode(...raw.slice(0,4))!=='GT3E') throw new Error('ficheiro inválido');
  const iter=new DataView(raw.buffer).getUint32(4,true), salt=raw.slice(8,24), iv=raw.slice(24,36), ct=raw.slice(36);
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pin),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',hash:'SHA-256',salt,iterations:iter},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv},key,ct); // falha se o PIN estiver errado
  const dv=new DataView(plain), jl=dv.getUint32(0,true);
  const meta=JSON.parse(new TextDecoder().decode(new Uint8Array(plain,4,jl)));
  gt3Bank={sr:meta.sr, clips:meta.clips, pcm:new Int16Array(plain,4+jl)};
}
function gt3Buffer(){
  if(gt3Buf && gt3BufCtx===ctx) return gt3Buf;
  const p=gt3Bank.pcm; gt3Buf=ctx.createBuffer(1,p.length,gt3Bank.sr); const d=gt3Buf.getChannelData(0);
  for(let i=0;i<p.length;i++) d[i]=p[i]/32768;
  gt3BufCtx=ctx; return gt3Buf;
}

function initAudio(){
  ctx = new (window.AudioContext||window.webkitAudioContext)();
  master = ctx.createGain(); master.gain.value = Math.pow(+$('vol').value,2);
  const comp = ctx.createDynamicsCompressor();
  comp.threshold.value=-18; comp.ratio.value=4; comp.attack.value=0.01; comp.release.value=0.25;
  master.connect(comp); comp.connect(ctx.destination);
  // eco curto para dar espaço
  const dly=ctx.createDelay(1); dly.delayTime.value=0.27;
  const fb=ctx.createGain(); fb.gain.value=0.32;
  const dlp=ctx.createBiquadFilter(); dlp.type='lowpass'; dlp.frequency.value=2200;
  const wet=ctx.createGain(); wet.gain.value=0.22;
  master.connect(dly); dly.connect(fb); fb.connect(dly); dly.connect(dlp); dlp.connect(wet); wet.connect(comp);
}
function setPreset(p){
  preset=p;
  document.querySelectorAll('#presets button').forEach(b=>b.classList.toggle('on',b.dataset.p===p));
  if(!ctx) return;
  const old=engine;

    setTimeout(()=>{ old.srcs.forEach(s=>{try{s.stop()}catch(e){}}); old.out.disconnect(); },800); }
}

/* ---------- GPS ---------- */
let watchId=null, lastFix=null, fixTimes=[], lastAcc=null, srcLabel='–';
function hav(a,b){
  const R=6371000, toR=Math.PI/180;
  const dLat=(b.lat-a.lat)*toR, dLon=(b.lon-a.lon)*toR;
  const x=Math.sin(dLat/2)**2 + Math.cos(a.lat*toR)*Math.cos(b.lat*toR)*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(x));
}
function onPos(p){
  const now=performance.now(), c=p.coords;
  fixTimes.push(now); lastAcc=c.accuracy;
  if(c.accuracy>60){ setStatus('Sinal GPS fraco (±'+Math.round(c.accuracy)+' m). À espera de melhor sinal.'); return; }
  const cur={lat:c.latitude, lon:c.longitude, acc:c.accuracy, t:p.timestamp};
  let z=null, R=null, calc=false;
  if(c.speed!==null && c.speed!==undefined && !isNaN(c.speed)){
    z=c.speed; const sa=c.speedAccuracy||0.5;
    R=Math.max(0.09, sa*sa)*(c.accuracy>20?2:1); srcLabel='GPS';
  } else if(lastFix){
    const dt=(cur.t-lastFix.t)/1000;
    if(dt>0.3){ z=hav(lastFix,cur)/dt; const e=(cur.acc+lastFix.acc)/dt; R=Math.max(0.5,0.3*e*e); calc=true; srcLabel='Calculada'; }
  }
  lastFix=cur;
  if(z===null) { setStatus('A receber posição, à espera de velocidade.'); return; }
  // rejeita saltos absurdos quando a velocidade é calculada por posições
  if(calc && kf.t!==null && Math.abs(z-kf.v) > 4*Math.sqrt(kf.innovationSigma()**2+R) + 3) return;
  kf.ingest(z,R,now);
  setStatus('GPS ativo.');
}
function onErr(e){
  const m={1:'Sem permissão de localização. Autoriza a localização para este site no browser.',
           2:'Posição indisponível. Verifica se há céu aberto.',3:'O GPS demorou a responder. A tentar de novo.'};
  setStatus(m[e.code]||('Erro de GPS: '+e.message));
}
function startGPS(){
  if(!('geolocation' in navigator)){ setStatus('Este browser não dá acesso à localização. Usa o modo Simulação.'); return; }
  if(watchId!==null) return;
  watchId=navigator.geolocation.watchPosition(onPos,onErr,{enableHighAccuracy:true,maximumAge:0,timeout:10000});
  setStatus('A pedir localização…');
}
function stopGPS(){ if(watchId!==null){ navigator.geolocation.clearWatch(watchId); watchId=null; } }

/* ---------- Simulação (testar parado) ---------- */
let mode='gps', simV=0, thr=false, brk=false, nextSimFix=0;
function simStep(dt,now){
  const a = thr ? 3.2 : brk ? -6 : -0.5;
  simV = clamp(simV + a*dt, 0, 70);
  if(now>=nextSimFix){ // imita GPS a 1 Hz com ruído
    nextSimFix=now+1000;
    const g=(Math.random()+Math.random()+Math.random()-1.5)*0.35;
    kf.ingest(Math.max(0,simV+g),0.09,now); fixTimes.push(now); lastAcc=4; srcLabel='Simulada';
  }
}
function bindPedal(el,set){
  const on=e=>{e.preventDefault(); set(true); el.classList.add('down');};
  const off=()=>{set(false); el.classList.remove('down');};
  el.addEventListener('pointerdown',on);
  ['pointerup','pointerleave','pointercancel'].forEach(t=>el.addEventListener(t,off));
}
bindPedal($('thr'),v=>thr=v); bindPedal($('brk'),v=>brk=v);

function setMode(m){
  mode=m; kf.reset(); lastFix=null; fixTimes=[]; simV=0; srcLabel='–'; lastAcc=null;
  document.querySelectorAll('#modes button').forEach(b=>b.classList.toggle('on',b.dataset.m===m));
  $('pedals').hidden = m!=='sim';
  if(running){ if(m==='gps') startGPS(); else { stopGPS(); setStatus('Simulação: carrega nos pedais.'); } }
  else stopGPS();
}

/* ---------- Animação: nave vista de trás + campo de estrelas ---------- */
const sky=$('sky'), g2=sky.getContext('2d');
let W=0, Hh=0;
function resizeSky(){ const d=Math.min(1.5,window.devicePixelRatio||1); W=innerWidth; Hh=innerHeight; sky.width=W*d; sky.height=Hh*d; g2.setTransform(d,0,0,d,0,0); }
addEventListener('resize',resizeSky); resizeSky();
function newStar(any){ return {x:(Math.random()*2-1), y:(Math.random()*2-1)*0.65, z:any?0.05+Math.random()*0.95:1}; }
const STARS=[]; for(let i=0;i<420;i++) STARS.push(newStar(true));
let warpS=0, thrustS=0, skyT=0;
function drawSky(now,dt){
  skyT+=dt;
  const isCar=preset==='gt3'||preset==='gt3s'; document.body.classList.toggle('car',isCar);
  if(isCar && carImg.complete && carImg.naturalWidth){ drawCar(dt); return; }
  const warp=1-Math.exp(-(sv*3.6)/80);
  warpS+=(warp-warpS)*(1-Math.exp(-dt/0.6));
  thrustS+=(clamp(sa/2.5,0,1)-thrustS)*(1-Math.exp(-dt/0.25));
  g2.globalCompositeOperation='source-over';
  g2.fillStyle='#03050c'; g2.fillRect(0,0,W,Hh);
  const cx=W/2, cy=Hh*0.42, f=Math.min(W,Hh*1.6)*0.55;
  const vz=0.025+1.7*Math.pow(warpS,1.5), trail=0.003+0.22*Math.pow(warpS,1.3);
  g2.lineCap='round';

    g2.fillStyle='#14181e'; g2.beginPath(); g2.arc(m*176,36,4,0,7); g2.fill();
    // nacela sob a asa
    g2.fillStyle=lg(30,70,['#c8d0da','#59626f']); g2.beginPath(); g2.ellipse(m*128,50,22,19,0,0,7); g2.fill(); g2.strokeStyle=EDGE; g2.lineWidth=1.3; g2.stroke();
    line(m*128-22,50,m*128-28,40,EDGE,3);
  }

  // ---- derivas dorsais ----
  for(const m of [-1,1]){
    poly(mir(m,[18,-56, 46,-128, 56,-130, 52,-118, 40,-50]),lg(-130,-50,['#f4f7fa','#9aa4b2']),EDGE,1.4);
    poly(mir(m,[44,-118, 53,-124, 50,-112, 42,-104]),ACC);
  }

  // ---- casco ----
  const hullG=lg(-78,56,['#ffffff','#dde3ea','#a9b3c0','#5a6371']);
  g2.fillStyle=hullG; g2.beginPath();
  g2.moveTo(-84,36); g2.quadraticCurveTo(-96,-24,-50,-62); g2.quadraticCurveTo(0,-84,50,-62); g2.quadraticCurveTo(96,-24,84,36);
  g2.quadraticCurveTo(0,62,-84,36); g2.closePath(); g2.fill(); g2.strokeStyle=EDGE; g2.lineWidth=1.8; g2.stroke();
  // espinha
  poly([-6,-78, 6,-78, 4,-40, -4,-40],'#c6ced8',EDGE,1);
  // antena
  line(0,-80,0,-128,'#cfd6df',3); line(-8,-112,8,-112,'#cfd6df',2);
  // painéis e grelhas laterais
  g2.strokeStyle=PANEL; g2.lineWidth=1.2;
  g2.beginPath(); g2.moveTo(-70,-20); g2.quadraticCurveTo(0,-44,70,-20); g2.stroke();
  g2.beginPath(); g2.moveTo(-58,-48); g2.lineTo(-74,24); g2.moveTo(58,-48); g2.lineTo(74,24); g2.stroke();
  for(const m of [-1,1]) for(let i=0;i<5;i++) line(m*(80-i*1.5),-8+i*7,m*(66-i*1.5),-6+i*7,'rgba(20,26,36,.55)',2);
  // faixa de identificação
  poly([-84,30, -60,-2, -54,2, -76,34],ACC2); poly([84,30, 60,-2, 54,2, 76,34],ACC2);
  // cabine (vista de trás: cúpula traseira)
  const cg=g2.createLinearGradient(0,-82,0,-50); cg.addColorStop(0,'#1d3b5c'); cg.addColorStop(1,'#060a12');
  g2.fillStyle=cg; g2.beginPath(); g2.ellipse(0,-62,32,15,0,Math.PI,0); g2.lineTo(32,-58); g2.quadraticCurveTo(0,-50,-32,-58); g2.closePath(); g2.fill();
  g2.strokeStyle='#cfd6df'; g2.lineWidth=2; g2.stroke();
  g2.fillStyle='rgba(180,225,255,.35)'; g2.beginPath(); g2.ellipse(-12,-70,12,3.5,-0.2,0,7); g2.fill();
  // placa traseira dos motores
  g2.fillStyle=lg(-30,48,['#4a525e','#272c34']); g2.beginPath(); g2.roundRect(-72,-30,144,72,18); g2.fill(); g2.strokeStyle=EDGE; g2.lineWidth=1.5; g2.stroke();
  // rebites
  g2.fillStyle='rgba(200,210,222,.5)';
  for(let i=-60;i<=60;i+=15){ g2.beginPath(); g2.arc(i,-24,1.4,0,7); g2.fill(); g2.beginPath(); g2.arc(i,36,1.4,0,7); g2.fill(); }

  // ---- motores (anéis) ----
  for(const e of ENGINES){
    g2.fillStyle='#8a94a2'; g2.beginPath(); g2.arc(e.x,e.y,e.r+4,0,7); g2.fill();
    g2.fillStyle='#2b313a'; g2.beginPath(); g2.arc(e.x,e.y,e.r,0,7); g2.fill();
    g2.strokeStyle='rgba(150,165,185,.35)'; g2.lineWidth=1;
    for(let k=0.8;k>0.3;k-=0.18){ g2.beginPath(); g2.arc(e.x,e.y,e.r*k,0,7); g2.stroke(); }
    // pás da turbina
    for(let k=0;k<10;k++){ const a=k/10*Math.PI*2+t*(2+12*th); line(e.x+Math.cos(a)*e.r*0.3,e.y+Math.sin(a)*e.r*0.3,e.x+Math.cos(a)*e.r*0.75,e.y+Math.sin(a)*e.r*0.75,'rgba(120,140,165,.4)',1.2); }
  }

  // ---- brilho e faíscas ----
  g2.globalCompositeOperation='lighter';
  const flick=0.88+0.12*Math.sin(t*37)+0.05*Math.sin(t*91);
  for(const e of ENGINES){
    const R=(e.r*0.9+e.r*3.4*th+e.r*0.9*warpS)*flick;
    const gl=g2.createRadialGradient(e.x,e.y,0,e.x,e.y,R);
    gl.addColorStop(0,'rgba(240,252,255,.95)'); gl.addColorStop(0.15,`rgba(120,215,255,${0.55+0.45*th})`);
    gl.addColorStop(0.5,`rgba(50,130,255,${0.18+0.3*th})`); gl.addColorStop(1,'rgba(40,90,255,0)');
    g2.fillStyle=gl; g2.beginPath(); g2.arc(e.x,e.y,R,0,7); g2.fill();
    g2.fillStyle='rgba(255,255,255,.9)'; g2.beginPath(); g2.arc(e.x,e.y,e.r*0.28,0,7); g2.fill();
  }
  const rate=(8+120*th+40*warpS)*dt;
  for(let n=Math.floor(rate)+(Math.random()<rate%1?1:0);n>0;n--){
    const e=ENGINES[Math.random()<0.8?Math.floor(Math.random()*2):2+Math.floor(Math.random()*3)], a=Math.random()*Math.PI*2, sp=40+Math.random()*(120+260*th);
    SPARKS.push({x:e.x,y:e.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:0,max:0.25+Math.random()*0.35});
  }
  for(let i=SPARKS.length-1;i>=0;i--){
    const s=SPARKS[i]; s.life+=dt; if(s.life>s.max){ SPARKS.splice(i,1); continue; }
    s.x+=s.vx*dt; s.y+=s.vy*dt; const k=1-s.life/s.max;
    g2.fillStyle=`rgba(150,220,255,${0.8*k})`; g2.beginPath(); g2.arc(s.x,s.y,1+2.5*(1-k),0,7); g2.fill();
  }
  // luzes de navegação
  const strobe=(t*1.3%1)<0.07?1:0;
  const lights=[[-262,50,'255,60,60',0.9],[262,50,'60,255,120',0.9],[-56,-130,'255,255,255',strobe],[56,-130,'255,255,255',strobe],[0,-128,'255,80,80',0.4+0.6*(Math.sin(t*4)>0.6?1:0)]];
  for(const [lx,ly,c,a] of lights){
    const r=g2.createRadialGradient(lx,ly,0,lx,ly,18); r.addColorStop(0,`rgba(${c},${a})`); r.addColorStop(1,`rgba(${c},0)`);
    g2.fillStyle=r; g2.beginPath(); g2.arc(lx,ly,18,0,7); g2.fill();
  }
  g2.restore();
}
$('viewBtn').addEventListener('click',()=>{ const v=document.body.classList.toggle('view'); $('viewBtn').textContent=v?'Controlos':'Nave'; });

/* ---------- Loop principal ---------- */
let sv=0, sa=0, lastF=performance.now(), lastAudio=0, lastUI=0;
let lastErr='';
function showErr(err){ const m='Erro: '+(err&&err.message||err); if(m!==lastErr){ lastErr=m; setStatus(m); console.error(err); } }
addEventListener('error',e=>showErr(e.error||e.message));
addEventListener('unhandledrejection',e=>showErr(e.reason));
function frame(now){
  const dt=Math.min(0.1,(now-lastF)/1000); lastF=now;
  if(running && mode==='sim') simStep(dt,now);
  const e=kf.estimate(now);
  let v=e.v; if(v<0.4) v=0;
  sv += (v-sv)*(1-Math.exp(-dt/tauV));
  sa += (e.a-sa)*(1-Math.exp(-dt/tauA));
  if(running && engine && now-lastAudio>50){
    const adt=Math.min(0.2,(now-lastAudio)/1000); lastAudio=now;
    const kmh=sv*3.6, s=1-Math.exp(-kmh/75);
    try{ engine.update(s, clamp(sa/2.5,0,1), clamp(-sa/3,0,1), {kmh, a:sa, dt:adt, sens}); }catch(err){ showErr(err); }
  }
  if(now-lastUI>80){
    lastUI=now;
    $('spd').textContent=Math.round(sv*3.6);
    const g=sa/9.81, w=Math.min(50,Math.abs(sa)/5*50), f=$('afill');
    f.style.width=w+'%'; f.style.left=sa>=0?'50%':(50-w)+'%';
    f.style.background=sa>=0?'var(--plasma)':'var(--brake)';
    $('ag').textContent=g.toFixed(2).replace('.',',')+' g';
    fixTimes=fixTimes.filter(t=>now-t<5000);
    $('rate').textContent=fixTimes.length? (fixTimes.length/5).toFixed(1).replace('.',',') : '–';
    $('acc').textContent=lastAcc!==null? '±'+Math.round(lastAcc)+' m' : '–';
    $('src').textContent=srcLabel;
    const ei=(running&&engine&&engine.info)?engine.info():null;
    $('eng').hidden=!ei; if(ei) $('eng').textContent=ei;
    $('hudSpd').textContent=Math.round(sv*3.6); $('hudEng').textContent=ei||'';
  }
  try{ drawSky(now,dt); }catch(err){ showErr(err); }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
